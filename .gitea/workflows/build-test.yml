name: Build and Test

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  HAIKU_HOST: taurus.microgeni.synology.me
  HAIKU_USER: user
  HAIKU_PROJECT_PATH: /Data/Code/Projects/haiku-claude-cli
  GITEA_REPO_URL: ssh://git@gitea.microgeni.synology.me:2222/daniel/haiku-claude-cli.git

jobs:
  build-and-test:
    name: Build & Test
    runs-on: haiku-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to Haiku
        env:
          REF: ${{ github.ref_name }}
        run: ./ci_scripts/sync_to_haiku.sh

      - name: Build on Haiku
        run: |
          ssh -n -o StrictHostKeyChecking=no "$HAIKU_USER@$HAIKU_HOST" \
            "cd '$HAIKU_PROJECT_PATH' && ./ci_scripts/build.sh </dev/null"

      - name: Test on Haiku
        run: |
          ssh -n -o StrictHostKeyChecking=no "$HAIKU_USER@$HAIKU_HOST" \
            "cd '$HAIKU_PROJECT_PATH' && ./ci_scripts/test.sh </dev/null"

      - name: Summary
        if: always()
        run: |
          echo "Status: ${{ job.status }}"
          echo "Ref:    ${{ github.ref_name }}"
          echo "Run:    ${{ github.run_number }}"
