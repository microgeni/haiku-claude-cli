name: Build and Test

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: haiku-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Test
        run: ./ci_scripts/test.sh

      - name: Summary
        if: always()
        run: |
          echo "Status: ${{ job.status }}"
          echo "Ref:    ${{ github.ref_name }}"
          echo "Run:    ${{ github.run_number }}"
