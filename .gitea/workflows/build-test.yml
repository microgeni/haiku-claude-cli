name: Build and Test

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  HAIKU_HOST: taurus.microgeni.synology.me
  HAIKU_USER: user
  HAIKU_PROJECT_PATH: /Data/Code/Projects/haiku-claude-cli
  GITEA_REPO_URL: ssh://git@gitea.microgeni.synology.me:2222/daniel/haiku-claude-cli.git

jobs:
  build:
    name: Build
    runs-on: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to Haiku
        env:
          REF: ${{ github.ref_name }}
        run: ./ci_scripts/sync_to_haiku.sh

      - name: Build on Haiku
        run: |
          ssh -o StrictHostKeyChecking=no "$HAIKU_USER@$HAIKU_HOST" \
            "cd '$HAIKU_PROJECT_PATH' && ./ci_scripts/build.sh"

  test:
    name: Test
    runs-on: macos-arm64
    needs: build
    steps:
      - name: Run tests on Haiku
        run: |
          ssh -o StrictHostKeyChecking=no "$HAIKU_USER@$HAIKU_HOST" \
            "cd '$HAIKU_PROJECT_PATH' && ./ci_scripts/test.sh"

      - name: Summary
        if: always()
        run: |
          echo "Build:  ${{ needs.build.result }}"
          echo "Test:   ${{ job.status }}"
          echo "Ref:    ${{ github.ref_name }}"
          echo "Run:    ${{ github.run_number }}"
