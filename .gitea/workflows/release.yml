name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PATH: /boot/home/config/non-packaged/bin:/boot/home/config/bin:/boot/system/non-packaged/bin:/bin:/boot/system/bin:/boot/system/apps

jobs:
  release:
    name: Release
    runs-on: haiku

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitHub
        env:
          GH_DEPLOY_KEY: ${{ secrets.GH_DEPLOY_KEY }}
        run: |
          /bin/bash -c '
            set -euo pipefail
            mkdir -p ~/.ssh
            echo "$GH_DEPLOY_KEY" > ~/.ssh/gh_deploy
            chmod 600 ~/.ssh/gh_deploy
            echo "StrictHostKeyChecking no" >> ~/.ssh/config
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/gh_deploy"
            git remote remove github 2>/dev/null || true
            git remote add github git@github.com:microgeni/haiku-claude-cli.git
            git push github HEAD:main
            git push github ${{ github.ref_name }}
            rm -f ~/.ssh/gh_deploy
          '

      - name: Build HPKG
        id: hpkg
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: /bin/bash ./ci_scripts/package_on_haiku.sh

      - name: Upload release to Gitea
        env:
          VERSION: ${{ github.ref_name }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PKG_NAME: ${{ steps.hpkg.outputs.pkg_name }}
        run: /bin/bash ./ci_scripts/upload_gitea_release.sh

      - name: Upload release to GitHub
        env:
          VERSION: ${{ github.ref_name }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          PKG_NAME: ${{ steps.hpkg.outputs.pkg_name }}
        run: /bin/bash ./ci_scripts/upload_github_release.sh
