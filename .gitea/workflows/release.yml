name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PATH: /boot/home/config/non-packaged/bin:/boot/home/config/bin:/boot/system/non-packaged/bin:/bin:/boot/system/bin:/boot/system/apps

jobs:
  release:
    name: Release
    runs-on: taurus

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Mirror to GitHub
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i /boot/home/.ssh/github_deploy_orig -o StrictHostKeyChecking=no"
          git remote remove github 2>/dev/null || true
          git remote add github git@github.com:microgeni/haiku-claude-cli.git
          git push --force github HEAD:main
          git push --force github ${{ github.ref_name }}

      - name: Build HPKG
        id: hpkg
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: /bin/bash ./ci_scripts/package_on_haiku.sh

      - name: Upload release to Gitea
        env:
          VERSION: ${{ github.ref_name }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PKG_NAME: ${{ steps.hpkg.outputs.pkg_name }}
        run: /bin/bash ./ci_scripts/upload_gitea_release.sh

      - name: Upload release to GitHub
        env:
          VERSION: ${{ github.ref_name }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          PKG_NAME: ${{ steps.hpkg.outputs.pkg_name }}
        run: /bin/bash ./ci_scripts/upload_github_release.sh
