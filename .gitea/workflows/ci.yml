name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PATH: /boot/home/config/non-packaged/bin:/boot/home/config/bin:/boot/system/non-packaged/bin:/bin:/boot/system/bin:/boot/system/apps

jobs:
  build-and-test:
    name: Build & Test
    runs-on: taurus

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify checkout
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "async_features_test.sh sha: $(sha256sum tests/async_features_test.sh)"
          echo "config.cpp lines: $(wc -l < src/config.cpp)"
          git reset --hard HEAD
          echo "After reset — async_features_test.sh sha: $(sha256sum tests/async_features_test.sh)"

      - name: Build
        run: /bin/bash ./ci_scripts/build.sh

      - name: Check (lint + security)
        run: /bin/bash ./ci_scripts/check.sh

      - name: Test
        run: /bin/bash ./ci_scripts/test.sh

      - name: Mirror to GitHub
        if: success()
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i /boot/home/.ssh/github_deploy_orig -o StrictHostKeyChecking=no"
          git remote remove github 2>/dev/null || true
          git remote add github git@github.com:microgeni/haiku-claude-cli.git
          git push --force github HEAD:${{ github.ref_name }}

      - name: Summary
        if: always()
        run: |
          /bin/bash -c "echo 'Status: ${{ job.status }}'; echo 'Ref:    ${{ github.ref_name }}'; echo 'Run:    ${{ github.run_number }}'"
