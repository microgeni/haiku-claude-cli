name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PATH: /boot/home/config/non-packaged/bin:/boot/home/config/bin:/boot/system/non-packaged/bin:/bin:/boot/system/bin:/boot/system/apps

jobs:
  build-and-test:
    name: Build & Test
    runs-on: taurus

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify checkout
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Tests file: $(wc -l < ci_scripts/test.sh) lines, async_features: $(wc -l < tests/async_features_test.sh) lines"
          # Hard-sync tracked files to HEAD in case checkout was partial
          git checkout -- .

      - name: Build
        run: /bin/bash ./ci_scripts/build.sh

      - name: Check (lint + security)
        run: /bin/bash ./ci_scripts/check.sh

      - name: Test
        run: /bin/bash ./ci_scripts/test.sh

      - name: Mirror to GitHub
        if: success()
        env:
          GH_DEPLOY_KEY: ${{ secrets.GH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$GH_DEPLOY_KEY" > ~/.ssh/gh_deploy
          chmod 600 ~/.ssh/gh_deploy
          printf 'Host github.com\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/gh_deploy\n' >> ~/.ssh/config
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gh_deploy -o StrictHostKeyChecking=no"
          git remote remove github 2>/dev/null || true
          git remote add github git@github.com:microgeni/haiku-claude-cli.git
          git push --force github HEAD:${{ github.ref_name }}
          rm -f ~/.ssh/gh_deploy

      - name: Summary
        if: always()
        run: |
          /bin/bash -c "echo 'Status: ${{ job.status }}'; echo 'Ref:    ${{ github.ref_name }}'; echo 'Run:    ${{ github.run_number }}'"
