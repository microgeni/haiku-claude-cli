<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claude CLI application icon — Haiku-style SVG draft.

  Designed against Haiku's official Icon Design Rules
  (https://www.haiku-os.org/development/icon-guidelines):

    * 1 px silhouette outline at the 32x32 display target
      (doubled here at the 64x64 viewBox so the edge stays
      crisp when Icon-O-Matic exports).
    * Saturated mixtures, never pure primaries. Base palette
      is a terracotta → burnt-orange → warm-brown ramp; the
      asterisk mark sits in desaturated cream so it reads on
      a color-muted desktop.
    * Drop shadow projects straight rightward under the tile,
      with self-shadow on the right face for contrast.
    * Top-left bright light source + ambient fill from the
      opposite side → top face is lightest; front face has a
      lighter band near its top edge.
    * Isometric base tile: left-front edge slopes ~2 right
      per 1 down; right edge about 1 up per 1 right.

  This SVG is *only* the starting geometry. Haiku icons ship
  as binary HVIF (Haiku Vector Icon Format), which only
  Icon-O-Matic can write. Conversion workflow:

    1. Copy this file onto a Haiku install (real or VM).
    2. Open Icon-O-Matic (ships with every Haiku install).
    3. File → Import → this SVG. Each <polygon> arrives as a
       separate shape you can restyle.
    4. Rebuild the flat fills as HVIF linear gradients —
       crisper than raster-ish flat colors at 16×16, and the
       binary format is still tiny.
    5. Optional: flag the tile-highlight and asterisk
       overlays with Min LOD so they hide at 16×16, leaving
       just the core silhouette visible at small sizes.
    6. File → Export → Haiku Vector Icon (.hvif).
    7. Save as assets/claude-icon.hvif in this repo. The
       Makefile install and HPKG package targets will stamp
       it onto the binary via `addattr … BEOS:ICON` when the
       file is present.

  Trademark note: the 8-point asterisk is Anthropic's Claude
  mark. This project is a personal Haiku client for the
  Anthropic API, not an Anthropic product — if you ever plan
  to distribute this via HaikuDepot or similar, consider
  swapping the asterisk for a neutral glyph (stylized `C`,
  terminal cursor, chat bubble).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <!-- Rightward drop shadow under the whole tile. Haiku
       rules: always project straight right, not diagonal. -->
  <ellipse cx="36" cy="58" rx="22" ry="3" fill="#2A0E06" opacity="0.35"/>

  <!-- Isometric tile — right side face (darkest, ambient-lit). -->
  <polygon points="50,16 54,20 54,50 50,48"
           fill="#7A2E1C" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Front face (mid-tone, catches the primary light from
       the top-left; gets a lighter overlay up top below). -->
  <polygon points="8,22 50,16 50,48 8,54"
           fill="#C65E3E" stroke="#000" stroke-width="1.5"
           stroke-linejoin="round"/>

  <!-- Top face (lightest, full primary light). -->
  <polygon points="4,18 46,10 54,14 54,20 50,16 8,22"
           fill="#E08560" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Front-face top-edge sheen: "front surface lighter at
       the top" per Haiku rules. Convert to a linear gradient
       during Icon-O-Matic import for a smoother result. -->
  <polygon points="8,22 50,16 50,30 8,32"
           fill="#DE7956" opacity="0.55"/>

  <!-- Top-face left highlight — simulates the top-left light
       source. Same Icon-O-Matic tip: turn into a gradient. -->
  <polygon points="4,18 28,14 28,16 4,20"
           fill="#EFA782" opacity="0.55"/>

  <!-- Claude asterisk, 8 equal rays, centered on the front
       face. 16-vertex star polygon: outer radius 12, inner
       radius ~1.4, rotated so the top/bottom rays are
       vertical. Cream fill so it reads on the orange tile. -->
  <polygon transform="translate(29 36)"
           fill="#F3DEC2" stroke="#000" stroke-width="0.75"
           stroke-linejoin="round"
           points="
             0,-12
             0.57,-1.39
             8.49,-8.49
             1.39,-0.57
             12,0
             1.39,0.57
             8.49,8.49
             0.57,1.39
             0,12
             -0.57,1.39
             -8.49,8.49
             -1.39,0.57
             -12,0
             -1.39,-0.57
             -8.49,-8.49
             -0.57,-1.39
           "/>

  <!-- Subtle asterisk top-left highlight (single stroke so
       it survives round-tripping through SVG tooling). -->
  <polygon transform="translate(29 36)"
           fill="#FBF1E0" opacity="0.5"
           points="
             0,-11
             0.4,-1.2
             6.2,-6.2
             1.1,-0.45
             11,-0.2
             0.3,0
             -6,-6
             -0.45,-1.1
           "/>
</svg>
