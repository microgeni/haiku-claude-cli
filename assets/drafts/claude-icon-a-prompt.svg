<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claude CLI icon — Variant A: "Haiku at the prompt"

  Keyword fit: AI · Claude · Haiku · Terminal · Future.
  A cream `>` prompt glyph on the left of the front face,
  followed by three stair-stepped cream bars (5-7-5 syllable
  widths). Reads as "someone typing a haiku into a terminal
  prompt." Cool indigo/twilight palette is the deliberate
  "future" move — the icon shouldn't look like another
  warm-toned terminal app.

  Haiku Icon Design Rules applied:
    - Isometric tile, 3 visible faces, 1 px silhouette
      outline (scaled here to ~2 px at the 64x64 viewBox).
    - Saturated mixtures — indigo is navy + violet + slate,
      never pure blue.
    - Top-left bright light → top face lightest, right side
      darkest, front face mid with a lighter band at top.
    - Drop shadow projects straight rightward.

  Icon-O-Matic tip: rebuild the flat front-face / top-face
  overlays as HVIF linear gradients on import for a smoother
  look. The `>` and bars can stay as solid shapes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <ellipse cx="36" cy="58" rx="22" ry="3" fill="#0A0612" opacity="0.45"/>

  <!-- Right side face (deepest indigo). -->
  <polygon points="50,16 54,20 54,50 50,48"
           fill="#1E1830" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Front face (mid indigo). -->
  <polygon points="8,22 50,16 50,48 8,54"
           fill="#2D2448" stroke="#000" stroke-width="1.5"
           stroke-linejoin="round"/>

  <!-- Top face (lighter violet-indigo). -->
  <polygon points="4,18 46,10 54,14 54,20 50,16 8,22"
           fill="#3E3560" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Front-face top-edge sheen. -->
  <polygon points="8,22 50,16 50,30 8,32"
           fill="#342A52" opacity="0.65"/>

  <!-- Top-face left highlight (primary light). -->
  <polygon points="4,18 28,14 28,16 4,20"
           fill="#4A4070" opacity="0.6"/>

  <!-- `>` prompt glyph, cream, heavy stroke so it reads at
       16×16. Centered vertically on the front face. -->
  <path d="M 11 28 L 19 34 L 11 40"
        fill="none" stroke="#F3DEC2" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three typed bars — 5-7-5 stair-step, left-aligned to
       the prompt so they read as "typed content following
       the cursor." Rounded ends survive 16×16. -->
  <g fill="#F3DEC2" stroke="#000" stroke-width="0.5"
     stroke-linejoin="round">
    <rect x="23" y="27" width="14" height="2.8" rx="1.4"/>  <!-- 5 -->
    <rect x="23" y="33" width="22" height="2.8" rx="1.4"/>  <!-- 7 -->
    <rect x="23" y="39" width="14" height="2.8" rx="1.4"/>  <!-- 5 -->
  </g>

  <!-- Faint cyan rim on the prompt glyph — subtle "cursor
       glow" for the futurist vibe. Drop this layer in
       Icon-O-Matic if the glow reads too busy at 16×16. -->
  <path d="M 11 28 L 19 34 L 11 40"
        fill="none" stroke="#9FD8E0" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.18"/>
</svg>
