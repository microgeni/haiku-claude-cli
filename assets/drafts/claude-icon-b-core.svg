<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claude CLI icon — Variant B: "Glowing neural core"

  Keyword fit: AI-forward, less literal on Haiku/Terminal.
  A small amber-gold diamond core sits on the front face of
  a dark slate isometric tile; thin amber circuit traces
  radiate out to four corner nodes. Reads as an "AI core in
  a box" — abstract, sleek, obviously a thinking-machine
  icon. Palette is intentionally cooler than terracotta and
  warmer than pure cyber-green.

  Caveat: at 16×16 the circuit traces risk disappearing. In
  Icon-O-Matic, flag the trace + corner-node shapes with
  Min LOD so the core + tile silhouette are all that renders
  below ~24 px. The icon still reads as a "chip with a
  glowing heart" even without the traces.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <ellipse cx="36" cy="58" rx="22" ry="3" fill="#050A10" opacity="0.5"/>

  <!-- Right side face (nearly black, slight teal). -->
  <polygon points="50,16 54,20 54,50 50,48"
           fill="#0A1520" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Front face (slate). -->
  <polygon points="8,22 50,16 50,48 8,54"
           fill="#14202E" stroke="#000" stroke-width="1.5"
           stroke-linejoin="round"/>

  <!-- Top face (lighter slate-blue). -->
  <polygon points="4,18 46,10 54,14 54,20 50,16 8,22"
           fill="#1E2D3F" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Front top-edge sheen. -->
  <polygon points="8,22 50,16 50,30 8,32"
           fill="#1A2939" opacity="0.7"/>

  <!-- Top face highlight (primary light). -->
  <polygon points="4,18 28,14 28,16 4,20"
           fill="#27394F" opacity="0.7"/>

  <!-- Circuit traces on the front face — thin amber lines
       running from the four corners inward, terminating
       just outside the core. Flag as Min-LOD-hide in
       Icon-O-Matic so they vanish at 16×16. -->
  <g stroke="#D4A849" stroke-width="0.5" fill="none"
     stroke-linecap="round">
    <line x1="11" y1="24" x2="24" y2="32"/>
    <line x1="47" y1="20" x2="34" y2="32"/>
    <line x1="11" y1="51" x2="24" y2="38"/>
    <line x1="47" y1="47" x2="34" y2="38"/>
  </g>

  <!-- Small amber nodes at the trace ends (corners). -->
  <g fill="#E8BF5E" stroke="#5A4010" stroke-width="0.3">
    <circle cx="11" cy="24" r="1.1"/>
    <circle cx="47" cy="20" r="1.1"/>
    <circle cx="11" cy="51" r="1.1"/>
    <circle cx="47" cy="47" r="1.1"/>
  </g>

  <!-- Outer core halo (soft glow). -->
  <circle cx="29" cy="35" r="9" fill="#D4A849" opacity="0.12"/>
  <circle cx="29" cy="35" r="6" fill="#E8BF5E" opacity="0.22"/>

  <!-- AI core — diamond (rotated square) with inner gradient.
       The diamond silhouette carries the icon even when
       everything else scales away. -->
  <polygon points="29,29 35,35 29,41 23,35"
           fill="#F5E6A8" stroke="#000" stroke-width="0.8"
           stroke-linejoin="round"/>

  <!-- Core inner highlight (top-left lit). -->
  <polygon points="29,30 32,33 29,35 26,33"
           fill="#FFFAE0" opacity="0.85"/>
</svg>
