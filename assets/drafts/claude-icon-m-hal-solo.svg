<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claude CLI icon — Variant M: "HAL 9000 panel, standalone"

  Just HAL. Isometric 3D black panel with rounded
  corners (Haiku-native silhouette), glowing red eye
  centered on the front face, tiny "9000" stencil
  micro-text under the eye, and a small green Haiku
  leaf tucked into the top-right as the brand tie.

  No terminal chassis, no keyboard — the HAL panel IS
  the icon. Reads instantly as "AI" at every size; the
  leaf signals "Haiku" for viewers paying attention.

  Haiku Icon Design Rules applied:
    - Isometric 3D tile with three visible faces
      (black panel gets subtle gradient between top,
      front, and right side).
    - 1 px silhouette outline, rounded corners via
      clipPath so the rectangular panel reads as the
      iconic HAL "door frame" shape.
    - Rightward drop shadow under the panel.
    - Top-left bright light → top face slightly lighter
      than front, right face darkest.
    - The red eye's concentric layers fake a radial
      gradient (dark red → bright orange → yellow core).
      Convert to a proper HVIF radial gradient in
      Icon-O-Matic.

  Trademark: same caveat as Variant L — HAL 9000 is a
  Kubrick/Clarke creation; fine as a loose "AI icon"
  reference for personal use, swap for a neutral design
  before public distribution.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <defs>
    <clipPath id="hal-silhouette">
      <path d="
        M 6 18
        Q 4 16   6 14
        L 46 8
        Q 48 8   50 10
        L 54 14
        Q 56 16  56 18
        L 56 50
        Q 56 52  54 54
        L 10 54
        Q 8 54   8 52
        L 8 22
        Q 8 20   6 18
        Z"/>
    </clipPath>
  </defs>

  <ellipse cx="36" cy="58" rx="22" ry="3" fill="#000000" opacity="0.55"/>

  <g clip-path="url(#hal-silhouette)">
    <!-- Right side face (deep black). -->
    <polygon points="50,14 54,18 54,52 50,48"
             fill="#0A0A0A" stroke="#000" stroke-width="1.2"
             stroke-linejoin="round"/>
    <!-- Front face (matte near-black). -->
    <polygon points="8,20 50,14 50,52 8,56"
             fill="#1A1818" stroke="#000" stroke-width="1.5"
             stroke-linejoin="round"/>
    <!-- Top face (slightly lighter, catches top-left light). -->
    <polygon points="4,16 46,8 54,12 54,18 50,14 8,20"
             fill="#242222" stroke="#000" stroke-width="1.2"
             stroke-linejoin="round"/>

    <!-- Front-face top-edge sheen. -->
    <polygon points="8,20 50,14 50,28 8,30"
             fill="#222020" opacity="0.85"/>
    <!-- Top-face left highlight. -->
    <polygon points="4,16 26,12 26,14 4,18"
             fill="#2E2C2C" opacity="0.8"/>

    <!-- Subtle inner-bezel line around the eye area so the
         eye reads as "inset into the panel" rather than
         floating on top. -->
    <circle cx="29" cy="34" r="10" fill="none"
            stroke="#050505" stroke-width="1.2"/>

    <!-- HAL 9000 red eye — concentric layers faking a
         radial gradient. Slight off-center inner highlights
         for the fisheye lens look. -->
    <circle cx="29" cy="34" r="9"   fill="#1E0202" opacity="0.9"/>
    <circle cx="29" cy="34" r="7.5" fill="#5A0A0A"/>
    <circle cx="29" cy="34" r="6"   fill="#961414"/>
    <circle cx="29" cy="34" r="4.5" fill="#D82828"/>
    <circle cx="29.3" cy="34.3" r="3.2" fill="#FF5818"/>
    <circle cx="29.5" cy="34.4" r="1.8" fill="#FFD070"/>
    <circle cx="29.6" cy="34.5" r="0.7" fill="#FFFFFF"/>

    <!-- "9000" micro-stencil under the eye, red-on-black.
         Redraw as HVIF path shapes in Icon-O-Matic. -->
    <text x="29" y="48"
          font-family="Helvetica, Arial, sans-serif"
          font-weight="700" font-size="4"
          fill="#7A0A0A"
          text-anchor="middle"
          letter-spacing="0.6">9000</text>

    <!-- Haiku leaf in the top-right corner. "This HAL
         runs on Haiku." -->
    <path d="M 46 16 Q 48 14 49.5 15 Q 48 16.5 46 16 Z"
          fill="#7FBF5F" stroke="#3F6B28" stroke-width="0.35"/>
    <path d="M 46 16 Q 45 17.5 46 19"
          fill="none" stroke="#3F6B28" stroke-width="0.4"
          stroke-linecap="round"/>
    <path d="M 44.5 17.5 Q 43 17 42.5 18 Q 43.5 19 44.5 17.5 Z"
          fill="#6AA84F" stroke="#3F6B28" stroke-width="0.3"/>
  </g>

  <!-- Silhouette outline traced over the clipped faces. -->
  <path d="
    M 6 18
    Q 4 16   6 14
    L 46 8
    Q 48 8   50 10
    L 54 14
    Q 56 16  56 18
    L 56 50
    Q 56 52  54 54
    L 10 54
    Q 8 54   8 52
    L 8 22
    Q 8 20   6 18
    Z"
        fill="none" stroke="#000" stroke-width="1.4"
        stroke-linejoin="round"/>
</svg>
