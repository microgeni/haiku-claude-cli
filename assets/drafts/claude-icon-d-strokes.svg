<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claude CLI icon — "three-stroke haiku" variant.

  Trademark-clean alternative to the asterisk draft
  (claude-icon.svg). Same Haiku-style isometric terracotta
  tile base; the front face swaps the 8-point Claude
  asterisk for three cream bars whose widths mirror the
  5-7-5 syllable pattern of a traditional haiku. A direct
  nod to the OS's own naming origin, and a quiet pun on the
  app being a conversational CLI — "a CLI that writes like
  a haiku."

  Designed against haiku-os.org/development/icon-guidelines
  (see the asterisk draft for the full rule list). Same
  Icon-O-Matic workflow applies: import SVG → convert flat
  fills to HVIF linear gradients → export .hvif.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <!-- Rightward drop shadow. -->
  <ellipse cx="36" cy="58" rx="22" ry="3" fill="#2A0E06" opacity="0.35"/>

  <!-- Right side face (darkest). -->
  <polygon points="50,16 54,20 54,50 50,48"
           fill="#7A2E1C" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Front face (mid tone). -->
  <polygon points="8,22 50,16 50,48 8,54"
           fill="#C65E3E" stroke="#000" stroke-width="1.5"
           stroke-linejoin="round"/>

  <!-- Top face (lightest, catches the primary light). -->
  <polygon points="4,18 46,10 54,14 54,20 50,16 8,22"
           fill="#E08560" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Front-face top-edge sheen. Convert to linear gradient
       during Icon-O-Matic import. -->
  <polygon points="8,22 50,16 50,30 8,32"
           fill="#DE7956" opacity="0.55"/>

  <!-- Top-face left highlight for the primary light source. -->
  <polygon points="4,18 28,14 28,16 4,20"
           fill="#EFA782" opacity="0.55"/>

  <!-- Three cream bars — 5-7-5 widths, centered on the front
       face at x=29. Rounded ends keep them readable at 16×16,
       the thin black stroke gives the silhouette a crisp edge
       against the warm tile. -->
  <g fill="#F3DEC2" stroke="#000" stroke-width="0.5"
     stroke-linejoin="round">
    <rect x="20" y="26" width="18" height="3" rx="1.5"/>  <!-- 5 -->
    <rect x="16" y="34" width="26" height="3" rx="1.5"/>  <!-- 7 -->
    <rect x="20" y="42" width="18" height="3" rx="1.5"/>  <!-- 5 -->
  </g>

  <!-- Top-bar highlight — subtle cream glint so the stack has
       a visible "reading direction" (top → bottom) matching
       the top-left light source. -->
  <rect x="20" y="26" width="12" height="1" rx="0.5"
        fill="#FBF1E0" opacity="0.7"/>
</svg>
