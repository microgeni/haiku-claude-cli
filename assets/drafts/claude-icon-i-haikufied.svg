<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claude CLI icon — Variant I: "Haikufied Claude app icon"

  A direct homage to Anthropic's Claude app icon (rounded
  apricot square with a cream 8-point asterisk), translated
  into Haiku's visual vocabulary: isometric 3D tile with
  three visible faces, rightward drop shadow, 1 px
  silhouette outline, saturated-mixture apricot palette.

  Differences from the Claude app icon:
    - Flat 2D squircle → 3D isometric tile with top/front/
      right faces and proper Haiku lighting.
    - Pointy-star asterisk rays → tapered almond petals
      (four overlapping ellipses at 45° intervals, which
      is closer to how the real Claude mark is drawn).
    - Rounded silhouette corners via clipPath, so the
      tile still reads as "rounded square from the front,"
      just with 3D depth.

  Trademark note: this is the closest of the variants to
  Anthropic's registered mark. Fine for personal use /
  design exploration; swap for a trademark-clean variant
  (F CRT, G scroll, D/C haiku strokes) for any public
  distribution.

  Haiku Icon Design Rules still apply:
    - Rightward drop shadow.
    - Top-left light → top face lightest, right face
      darkest.
    - No pure primaries — the apricot ramp is
      orange + yellow + rose, not pure red-orange.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <defs>
    <!-- Silhouette clip path: the outer outline of the
         three isometric faces rendered as a rounded path.
         Every face inside the clip appears with a soft
         outer corner instead of a sharp one. -->
    <clipPath id="tile-silhouette">
      <path d="
        M 6 20
        Q 4 18   6 16
        L 46 8
        Q 48 8   50 10
        L 54 14
        Q 56 16  56 18
        L 56 50
        Q 56 52  54 54
        L 10 54
        Q 8 54   8 52
        L 8 24
        Q 8 22   6 20
        Z"/>
    </clipPath>
  </defs>

  <ellipse cx="36" cy="58" rx="22" ry="3"
           fill="#3A1A08" opacity="0.4"/>

  <g clip-path="url(#tile-silhouette)">
    <!-- Right side face (darkest apricot). -->
    <polygon points="50,16 54,20 54,52 50,48"
             fill="#B96540" stroke="#000" stroke-width="1.2"
             stroke-linejoin="round"/>

    <!-- Front face (warm apricot). -->
    <polygon points="8,22 50,16 50,52 8,56"
             fill="#E38955" stroke="#000" stroke-width="1.5"
             stroke-linejoin="round"/>

    <!-- Top face (lightest apricot, catches top-left light). -->
    <polygon points="4,18 46,10 54,14 54,20 50,16 8,22"
             fill="#F4A574" stroke="#000" stroke-width="1.2"
             stroke-linejoin="round"/>

    <!-- Front-face top-edge sheen — lighter band. -->
    <polygon points="8,22 50,16 50,32 8,34"
             fill="#EB9360" opacity="0.55"/>

    <!-- Top-face left highlight for the primary light. -->
    <polygon points="4,18 28,14 28,16 4,20"
             fill="#FAB585" opacity="0.6"/>
  </g>

  <!-- Silhouette outline traced over the clipped faces so
       the rounded outer edge gets a crisp 1 px border. -->
  <path d="
    M 6 20
    Q 4 18   6 16
    L 46 8
    Q 48 8   50 10
    L 54 14
    Q 56 16  56 18
    L 56 50
    Q 56 52  54 54
    L 10 54
    Q 8 54   8 52
    L 8 24
    Q 8 22   6 20
    Z"
        fill="none" stroke="#000" stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- Tapered-almond Claude asterisk: four overlapping
       ellipses at 0°, 45°, 90°, 135° = eight rays total.
       Cream fill with a subtle dark edge. Thin stroke
       only on the outer silhouette; the overlaps at the
       center merge into a solid hub automatically. -->
  <g transform="translate(29 36)">
    <g fill="#F3DEC2" stroke="none">
      <ellipse cx="0" cy="0" rx="1.7" ry="12"/>
      <ellipse cx="0" cy="0" rx="1.7" ry="12" transform="rotate(45)"/>
      <ellipse cx="0" cy="0" rx="1.7" ry="12" transform="rotate(90)"/>
      <ellipse cx="0" cy="0" rx="1.7" ry="12" transform="rotate(135)"/>
    </g>

    <!-- Central hub, slightly brighter to echo the app
         icon's lit core. -->
    <circle cx="0" cy="0" r="2.2" fill="#FBF1E0"/>

    <!-- Top-left highlight on the asterisk (primary light). -->
    <ellipse cx="-4" cy="-4" rx="1.6" ry="1"
             fill="#FFFFFF" opacity="0.5"
             transform="rotate(-35)"/>
  </g>
</svg>
