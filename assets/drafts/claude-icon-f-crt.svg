<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claude CLI icon — Variant F: "Retro CRT terminal"

  Fits the Haiku icon vocabulary directly — a tiny 3D
  physical device with character, the way Tracker,
  StyledEdit, Terminal and Deskbar each present themselves.
  Cream/ivory CRT chassis, amber-glowing screen on the
  front, small vent details on the top face, power-LED dot
  bottom-right. The screen shows a `>` prompt followed by
  three stair-stepped cream lines (the haiku).

  Keyword coverage:
    Terminal → literally a terminal.
    AI       → the screen glowing "on its own" and typing.
    Claude   → the lines being composed at the prompt.
    Haiku    → 5-7-5 stair-step bars.
    Future   → amber-on-dark CRT is the classic
               retro-futurist terminal aesthetic.

  Haiku Icon Design Rules: isometric chassis, 1 px
  silhouette outline, rightward drop shadow, top-left
  bright light (cream top face lighter than front), no
  pure primaries (cream is desaturated warm off-white; the
  amber screen is a mix of orange + yellow + brown).

  Icon-O-Matic tips when converting to HVIF:
    - Rebuild the screen fill as a radial gradient (dark
      center → amber edge) for that CRT-phosphor glow.
    - Flag the top-face vents, the LED dot, and the
      corner bezel detail with Min LOD so they drop at
      16 px; the core chassis + amber screen survive.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <ellipse cx="34" cy="58" rx="24" ry="3" fill="#2A1808" opacity="0.4"/>

  <!-- CRT chassis: right side face (deepest cream-shadow). -->
  <polygon points="50,16 54,20 54,50 50,48"
           fill="#9E8F7C" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Chassis front face (mid cream). -->
  <polygon points="8,22 50,16 50,48 8,54"
           fill="#C7B49C" stroke="#000" stroke-width="1.5"
           stroke-linejoin="round"/>

  <!-- Chassis top face (lightest). -->
  <polygon points="4,18 46,10 54,14 54,20 50,16 8,22"
           fill="#DFCDB4" stroke="#000" stroke-width="1.2"
           stroke-linejoin="round"/>

  <!-- Top-face vents — three small parallel slits echoing
       the vents on a real CRT. Min-LOD-hide at 16 px. -->
  <g fill="#9E8F7C" stroke="none">
    <polygon points="12,18 20,16 20,16.8 12,18.8"/>
    <polygon points="22,16 30,14.2 30,15 22,16.8"/>
    <polygon points="32,14.2 40,12.4 40,13.2 32,15"/>
  </g>

  <!-- Top-face left highlight. -->
  <polygon points="4,18 24,14 24,15.6 4,19.6"
           fill="#EFE3D1" opacity="0.55"/>

  <!-- Screen bezel — a darker inset frame around the
       amber phosphor area. Small corner curves so it
       reads as rounded glass. -->
  <polygon points="12,25 46,19.2 46,44.5 12,50.3"
           fill="#5C5244" stroke="#000" stroke-width="0.8"
           stroke-linejoin="round"/>

  <!-- The amber CRT screen itself. Convert to radial
       gradient on import (dark center, amber edge). -->
  <polygon points="14,26.5 44,21.5 44,42.5 14,47.5"
           fill="#3A2812" stroke="none"/>

  <!-- Amber phosphor glow overlay — simulate the bright
       inner area of the CRT face with a softer amber
       fill that stops short of the bezel. -->
  <polygon points="16,28 42,23.5 42,41 16,45.5"
           fill="#6B3A10" opacity="0.7"/>

  <!-- `>` prompt on the screen (amber-cream). -->
  <path d="M 18 31 L 22 33.8 L 18 36.5"
        fill="none" stroke="#F8D890" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three stair-stepped bars on the screen (5-7-5). -->
  <g fill="#F8D890">
    <rect x="24"   y="31.2" width="8"  height="1.6" rx="0.8"/>
    <rect x="24"   y="34.3" width="13" height="1.6" rx="0.8"/>
    <rect x="24"   y="37.4" width="8"  height="1.6" rx="0.8"/>
  </g>

  <!-- Power LED dot on the chassis, bottom-right under the
       screen. Green, with a subtle bloom. Classic detail. -->
  <circle cx="44" cy="46" r="1.3" fill="#4EC03A"
          stroke="#000" stroke-width="0.3"/>
  <circle cx="44" cy="46" r="2.4" fill="#4EC03A" opacity="0.22"/>
</svg>
