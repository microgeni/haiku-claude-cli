<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Inner glow halo -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="20%" stop-color="#ffc46a"/>
      <stop offset="50%" stop-color="#ff8a1a"/>
      <stop offset="80%" stop-color="#5a1f00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass dome -->
    <radialGradient id="dome" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#2e2e34"/>
      <stop offset="55%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>

    <!-- Outer bezel -->
    <linearGradient id="bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7a82"/>
      <stop offset="50%" stop-color="#1f1f24"/>
      <stop offset="100%" stop-color="#5a5a62"/>
    </linearGradient>

    <!-- Cursor glow -->
    <linearGradient id="cursor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#ffb84a"/>
      <stop offset="100%" stop-color="#ff8a1a"/>
    </linearGradient>

    <!-- Top reflection on dome -->
    <linearGradient id="reflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer bezel ring -->
  <circle cx="128" cy="128" r="122" fill="url(#bezel)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#0a0a0c" stroke-width="1"/>

  <!-- Inner bezel shadow -->
  <circle cx="128" cy="128" r="114" fill="#0a0a0c"/>

  <!-- Dome -->
  <circle cx="128" cy="128" r="110" fill="url(#dome)"/>

  <!-- Subtle scanlines (tighter, more refined) -->
  <g opacity="0.12" clip-path="circle(110px at 128 128)">
    <line x1="18" y1="70" x2="238" y2="70" stroke="#ff8a1a" stroke-width="0.6"/>
    <line x1="18" y1="86" x2="238" y2="86" stroke="#ff8a1a" stroke-width="0.6"/>
    <line x1="18" y1="102" x2="238" y2="102" stroke="#ff8a1a" stroke-width="0.6"/>
    <line x1="18" y1="118" x2="238" y2="118" stroke="#ff8a1a" stroke-width="0.6"/>
    <line x1="18" y1="134" x2="238" y2="134" stroke="#ff8a1a" stroke-width="0.6"/>
    <line x1="18" y1="150" x2="238" y2="150" stroke="#ff8a1a" stroke-width="0.6"/>
    <line x1="18" y1="166" x2="238" y2="166" stroke="#ff8a1a" stroke-width="0.6"/>
    <line x1="18" y1="182" x2="238" y2="182" stroke="#ff8a1a" stroke-width="0.6"/>
  </g>

  <!-- Glow halo -->
  <circle cx="128" cy="128" r="78" fill="url(#glow)" opacity="0.95"/>

  <!-- Cursor block (the eye) -->
  <g filter="url(#soft-glow)">
    <rect x="116" y="100" width="24" height="56" rx="1.5" fill="url(#cursor)"/>
  </g>

  <!-- Cursor inner highlight -->
  <rect x="119" y="103" width="6" height="50" rx="1" fill="#ffffff" opacity="0.3"/>

  <!-- Top dome reflection -->
  <ellipse cx="128" cy="62" rx="78" ry="22" fill="url(#reflection)"/>

  <!-- Bottom subtle reflection on bezel -->
  <ellipse cx="128" cy="226" rx="56" ry="4" fill="#ffffff" opacity="0.05"/>
</svg>
